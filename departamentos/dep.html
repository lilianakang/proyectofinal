<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departamentos de Guatemala</title>
    <link rel="stylesheet" href="dep.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Fontdiner+Swanky&family=Lavishly+Yours&family=Love+Ya+Like+A+Sister&family=Mountains+of+Christmas:wght@400;700&family=Mystery+Quest&family=Stack+Sans+Notch:wght@200..700&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="contenedor">
        <a class="volver" href="../main.html">← Volver al menú</a>
        <h1>Descubre Guatemala</h1>
        <p>Selecciona el departamento que desees conocer más.</p>
        <div id="area-controles">
            <select id="deptoselect">
                <option value="">Elige un departamento</option>
                <option value="altav">Alta Verapaz</option>
                <option value="bajav">Baja Verapaz</option>
                <option value="chima">Chimaltenango</option>
                <option value="chiqui">Chiquimula</option>
                <option value="progre">El Progreso</option>
                <option value="escuintla">Escuintla</option>
                <option value="guate">Guatemala</option>
                <option value="huehue">Huehuetenango</option>
                <option value="izabal">Izabal</option>
                <option value="jalapa">Jalapa</option>
                <option value="jutiapa">Jutiapa</option>
                <option value="peten">Petén</option>
                <option value="quetza">Quetzaltenango</option>
                <option value="quiche">Quiché</option>
                <option value="reu">Retalhuleu</option>
                <option value="saca">Sacatepéquez</option>
                <option value="sanm">San Marcos</option>
                <option value="santa">Santa Rosa</option>
                <option value="sol">Sololá</option>
                <option value="suchi">Suchitepéquez</option>
                <option value="toto">Totonicapán</option>
                <option value="zaca">Zacapa</option>
            </select>
            <button id="btnlimpiar">Limpiar</button>
        </div>
        <div id="infocard">
            <img id="deptoimagen" src="">
            <h2 id="deptonombre">Nombre del departamento</h2>
            <p id="deptodesc">Descripción:</p>
            <p id="deptocab">Cabecera:</p>
            <p id="deptoext">Extensión territorial:</p>
            <p id="deptopob">Población aproximada:</p>
            <p id="deptoclima">Clima predominante:</p>
            <p id="deptotur">Lugar turístico destacado:</p>
        </div>
    </div>
    <script src="dep.js"></script>
</body>
</html>
