<head>

<body>
    <div id="contenedor">
    <a class="volver" href="../main.html">← Volver al menú</a>    
    <h1>Cálculo de agua</h1>
        <p>Utilize esta calculadora para calcular el consumo diario de agua de su familia.</p>
      

  <div id="pagina-interna">

    <label for="personas">Número de personas:</label>
    <input type="number" id="personas" placeholder="Ej: 4">

    <label for="litros">Litros consumidos por persona al día:</label>
    <input type="number" id="litros" placeholder="Ej: 150">

    <button onclick="calcularConsumo()">Calcular</button>
    <button id="btnlimpiar">Limpiar</button>

    <div class="resultado" id="resultado" style="display:none;">
      <p id="diario"></p>
      <p id="semanal"></p>
      <p id="mensual"></p>
      <p id="recomendacion"></p>
    </div>

</div>

 <script src="agua.js"></script>

    </div>
</body>
